<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>objet room — 3D 중고 쇼룸</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E8643A' stroke-width='3'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-DVYKeUd1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C7nydoJ9.css">
  </head>
  <body>
    <!-- 배경: 카메라 영상이 화면 전체를 채운다 -->
    <div class="camera-bg" id="camera-bg">
    </div>
    <div class="camera-shade" aria-hidden="true"></div>
    <canvas class="hand-layer" id="hand-layer" aria-hidden="true"></canvas>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="wordmark">objet<span>room</span></span>
          <span class="hud-label" id="clock">SESSION</span>
        </div>
        <div class="mode-switch" role="radiogroup" aria-label="모드">
          <button role="radio" data-mode="seller" aria-checked="true">판매자</button>
          <button role="radio" data-mode="buyer" aria-checked="false">구매자</button>
        </div>
        <div class="top-status">
          <div class="status-stack">
            <span class="meta" id="storage-status" title="저장 위치">저장 · 이 탭 세션에만 (새로고침 시 삭제)</span>
            <span class="meta" id="upload-status">외부 전송 없음</span>
          </div>
          <span class="hand-status" id="hand-status" hidden><i data-side="right"></i>R<i data-side="left"></i>L</span>
          <button class="camera-pill" id="camera-pill" data-state="off"><i></i><span>카메라 꺼짐</span></button>
          <button class="icon-btn" id="help-btn" aria-label="조작 방법" title="조작 방법 (?)">?</button>
        </div>
      </header>

      <main class="workspace">
        <section class="stage" id="stage" tabindex="-1" aria-label="제품 관찰 영역">
          <div class="stage-intro" id="stage-intro"></div>
          <div class="cam-off" id="cam-off">
            <span class="eyebrow">Camera offline</span>
            <p class="cam-off-title">카메라를 연결하면<br />이 화면이 관찰 공간이 됩니다</p>
            <p class="cam-off-sub" id="cam-off-sub">영상은 이 기기 안에서만 처리되며 어디에도 전송되지 않습니다.</p>
            <button class="btn primary" id="cam-off-btn">카메라 연결</button>
          </div>
          <div class="stage-tags">
            <span class="gesture-chip" id="gesture-chip" hidden></span>
            <span class="model-badge" id="model-badge" hidden></span>
          </div>
          <aside class="info-card panel" id="info-card" hidden></aside>
          <aside class="pair-panel panel" id="pair-panel" hidden aria-label="폰 연동"></aside>
          <div class="telemetry" id="telemetry" hidden></div>
        </section>

        <aside class="shelf" aria-label="저장 슬롯">
          <header class="shelf-head">
            <span class="hud-label" id="shelf-title">보관함</span>
            <span class="hud-label mute" id="shelf-count">0 / 5</span>
          </header>
          <ol class="slots" id="slots"></ol>
          <p class="shelf-note" id="shelf-note"></p>
        </aside>
      </main>

      <footer class="dock">
        <div class="guide" aria-live="polite">
          <span class="guide-mark" aria-hidden="true"></span>
          <div>
            <p class="guide-main" id="guide-main"></p>
            <p class="guide-sub" id="guide-sub"></p>
          </div>
        </div>
        <div class="actions" id="actions"></div>
      </footer>
    </div>

    <div class="overlay" aria-hidden="true">
      <div class="cursor right" id="cursor-right" hidden></div>
      <div class="cursor left" id="cursor-left" hidden></div>
      <div class="ghost" id="ghost" hidden><img alt="" /></div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>

    <dialog id="dialog"></dialog>

  </body>
</html>
